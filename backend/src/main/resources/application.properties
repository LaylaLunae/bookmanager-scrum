spring.application.name=demo

# spring.datasource.url=jdbc:h2:file:/app/data/mydb

# Configuration H2
spring.datasource.url=jdbc:h2:mem:bookmanagerdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Console H2 (accessible via http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Affichage des requêtes SQL dans la console (pratique pour le debug)
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# Permettre le chargement du fichier data.sql au démarrage
spring.sql.init.mode=always

# Force Spring Boot à exécuter data.sql APRÈS la génération des tables par Hibernate
spring.jpa.defer-datasource-initialization=true