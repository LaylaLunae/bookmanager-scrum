version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - h2-data:/app/data
      - ./backend/uploads:/app/uploads
    environment:
      - SPRING_DATASOURCE_URL=jdbc:h2:file:/app/data/mydb
      - SPRING_MVC_CORS_ALLOWED_ORIGIN_PATTERNS=*
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    networks:
      - app-network
    depends_on:
      - backend

volumes:
  h2-data:

networks:
  app-network:
    driver: bridge
